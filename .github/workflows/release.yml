name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download fnpack
        run: npm run download:fnpack

      - name: Pack fpk
        run: npm run pack:fpk

      - name: Prepare release notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const changelogLines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = changelogLines.findIndex((l) => l.trim() === `## ${version}` || l.startsWith(`## ${version} `));
            let changelogBody = "";
            if (start !== -1) {
              let end = changelogLines.findIndex((l, i) => i > start && l.startsWith("## "));
              if (end === -1) end = changelogLines.length;
              changelogBody = changelogLines.slice(start + 1, end).join("\n").trim();
            }
            const lines = [`# fnOS App Template v${version}`, ""];
            if (changelogBody) {
              lines.push(changelogBody, "");
            } else {
              lines.push(
                "## Summary",
                "",
                "- Open-source fnOS Native app template powered by Nitro",
                "",
                "## Highlights",
                "",
                "- Nitro backend with fnOS unified gateway",
                "- Unix Socket runtime and gateway user context",
                "- fnOS package directory generator",
                "- Package structure validation",
                "- Automatic fnpack download in CI",
                "- GitHub Release artifact publishing",
                ""
              );
            }
            lines.push(
              "## Release Artifacts",
              "",
              "- `dist/app.tgz`: fnOS app payload archive",
              "- `dist/*.fpk`: installable fnOS package",
              "",
              "## Notes",
              "",
              "- Generated from GitHub Actions",
              "- Version source: `package.json`",
              "- Release notes source: `CHANGELOG.md` 对应版本章节（缺失时回退内置模板说明）"
            );
            fs.writeFileSync("RELEASE_NOTES.md", lines.join("\n") + "\n");
          '

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: fnOS App Template v${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/app.tgz
            dist/*.fpk
